name: tests

on:
  push:
    branches:
      - release/v2-reproducibility
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy scikit-learn joblib pyarrow torch pytest
      - name: Run unit tests
        run: python -m pytest -q
